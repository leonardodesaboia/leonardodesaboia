name: Update Bomberman contributions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/bomberman.yml

permissions:
  contents: read

concurrency:
  group: bomberman-contributions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Generate Bomberman for light and dark themes
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: bomberman
          hide_month_labels: 'false'

      - name: Check generated images
        shell: bash
        run: |
          test -s dist/bomberman-contribution-graph.svg
          test -s dist/bomberman-contribution-graph-dark.svg

      - name: Publish images to the output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
